<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新竹州人口族群分佈圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e2e2e2;--dlg:#f6f6f6;--panel:#ffffffee;--text:#23272e;--muted:#6b7280;--line:#d6d6d6;
  --stroke:#9c9c9c;--zero:#fbebdd;--shadow:0 6px 24px #0000001f;
  --font:"Yuanti TC","jf-openhuninn-2.1","jf-openhuninn-2.0","Zen Maru Gothic","M PLUS Rounded 1c","Hiragino Maru Gothic ProN","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
svg text{font-family:inherit}
[hidden]{display:none!important}
#app{position:relative;width:100%;height:100%}
#map{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
#map:active{cursor:grabbing}
.v{stroke:var(--stroke);stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .35s}
.v:hover{stroke:var(--text);stroke-width:1.6}
.v.sel{stroke:var(--text);stroke-width:2.2}
.card{position:absolute;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px}
#ctl{left:14px;top:14px;width:300px}
h1{font-size:18px;margin:0 0 2px;font-weight:700;letter-spacing:.04em}
.hint{margin:0 0 12px;color:var(--muted);font-size:12.5px}
.lbl{font-size:12px;color:var(--muted);margin:10px 0 6px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{border:2px solid var(--line);background:transparent;border-radius:999px;padding:7px 0;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.on{color:#fff;border-color:transparent;font-weight:700}
.seg{display:flex;background:var(--line);border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:6px 0;font-size:13px;cursor:pointer}
.seg button.on{background:var(--panel);box-shadow:0 1px 4px #0003;font-weight:700}
#legend{left:14px;bottom:14px;width:300px}
#legend h3{margin:0 0 8px;font-size:13.5px}
.lg{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:4px 0}
.lg b{width:26px;height:14px;border-radius:5px;flex:none;border:1px solid #0000001a}
.lg span{font-variant-numeric:tabular-nums}
#zoom{right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:16px}
#zoom button{width:38px;height:38px;border:0;border-radius:12px;background:transparent;font-size:20px;cursor:pointer}
#zoom button:hover{background:var(--line)}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:13px;box-shadow:var(--shadow);line-height:1.5;z-index:5;max-width:230px}
#tip small{color:var(--muted)}
#ov{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;animation:fade .2s}
.dlg{position:relative;width:min(640px,100%);max-height:100%;overflow:auto;background:var(--dlg);color:var(--text);border-radius:24px;padding:24px 24px 20px;box-shadow:0 20px 60px #0006;animation:pop .25s}
.dlg h2{margin:0;font-size:22px;letter-spacing:.04em}
.sub{margin:4px 0 16px;color:var(--muted);font-size:13.5px}
.x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--line);font-size:20px;cursor:pointer;line-height:1}
.body{display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:center}
#pie{width:230px;height:230px;flex:none}
#pie path{transition:transform .15s;transform-box:view-box;transform-origin:50% 50%;cursor:default}
#pie path.hl{transform:scale(1.06)}
.tw{flex:1;min-width:230px}
table{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th{font-weight:500;color:var(--muted);font-size:12.5px}
td:first-child,th:first-child{text-align:left}
tr.hl td{background:var(--line)}
tr.tot td{font-weight:700;border-bottom:0}
.dot{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:8px;vertical-align:-1px}
#note{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
@media (max-width:700px){
  #ctl{left:10px;right:10px;top:10px;width:auto;padding:12px 14px}
  .hint{display:none}
  h1{font-size:16px;margin-bottom:6px}
  #legend{left:10px;right:auto;bottom:10px;width:auto;padding:8px 12px}
  #legend h3{margin-bottom:3px;font-size:12px}
  .lg{margin:1px 0;font-size:11px}
  .lg b{width:18px;height:11px}
  #zoom{right:10px;bottom:10px}
  .dlg{padding:20px 16px 16px}
}
</style>
</head>

<div id="app">
  <svg id="map" role="img" aria-label="新竹州人口族群分佈地圖"><g id="g"></g></svg>

  <div class="card" id="legend"></div>

</div>

    <div class="body"><svg id="pie" viewBox="-115 -115 230 230"></svg>

    <p id="note" hidden></p>
  </div>

/* ---------- 分層設色 ---------- */
const K=10;
// seaborn rocket 色階：由淺（低）到深（高）
const ROCKET=['#03051a','#251433','#4c1d4b','#751f58','#a11a5b','#cb1b4f','#e83f3f','#f3714d','#f69c73','#f7c6a6','#faebdd'];
const rocket=d3.scaleLinear().domain(d3.range(11).map(i=>i/10)).range(ROCKET).interpolate(d3.interpolateRgb);
// Fisher-Jenks 自然斷點（輸入需已排序），回傳 k+1 個斷點
function jenks(d,k){
  const n=d.length,L=[],V=[];
  for(let i=0;i<=n;i++){L.push(new Array(k+1).fill(0));V.push(new Array(k+1).fill(Infinity))}
  for(let j=1;j<=k;j++){L[1][j]=1;V[1][j]=0}
  for(let l=2;l<=n;l++){
    let s1=0,s2=0,w=0,v=0;
    for(let m=1;m<=l;m++){
      const i3=l-m+1,val=d[i3-1];
      w++;s1+=val;s2+=val*val;v=s2-s1*s1/w;
      const i4=i3-1;
      if(i4!==0)for(let j=2;j<=k;j++)if(V[l][j]>=v+V[i4][j-1]){L[l][j]=i3;V[l][j]=v+V[i4][j-1]}
    }
    L[l][1]=1;V[l][1]=v;
  }
  const br=new Array(k+1);br[0]=d[0];br[k]=d[n-1];
  let kc=n;
  for(let j=k;j>=2;j--){br[j-1]=d[L[kc][j]-2];kc=L[kc][j]-1}
  return br;
}
function classify(){
  const vals=DATA.features.map(f=>share(f.properties,active)).filter(v=>v>0).sort(d3.ascending);
  if(!vals.length){edges=[];nc=0;return}
  const e=[0];
  if(mode==='equal'){for(let i=1;i<K;i++)e.push(i/K)}
  else if(mode==='quantile'){for(let i=1;i<K;i++)e.push(d3.quantileSorted(vals,i/K))}
  else{const br=jenks(vals,Math.min(K,new Set(vals).size));for(let i=1;i<br.length-1;i++)e.push(br[i])}
  e.push(1); // 最大值一律為 100%
  edges=e.filter((v,i)=>i===0||v>e[i-1]+1e-9);
  nc=edges.length-1;
}
const ramp=i=>rocket(nc===1?.15:1-i/(nc-1));
function colorOf(v){
  if(v==null||v===0)return '#fbebdd'; // 零或無資料：最淺色
  for(let i=1;i<=nc;i++) if(v<=edges[i]+1e-12) return ramp(i-1);
  return ramp(nc-1);
}

  d3.select('#legend').html(h);

    const arcs=d3.pie().sort(null).value(x=>x.v)(items.filter(x=>x.v>0));
    const gg=pie.append('g');
    gg.selectAll('path').data(arcs).join('path').attr('d',arc).attr('fill',a=>a.data.color)
      .attr('stroke',css('--dlg')).attr('stroke-width',2)
      .on('mouseenter',(e,a)=>hl(a.data.k)).on('mouseleave',()=>hl(null))
      .append('title').text(a=>`${a.data.name}：${fmt(a.data.v)} 人（${pct(a.data.v/total)}）`);
    gg.selectAll('text').data(arcs.filter(a=>a.data.v/total>=.06)).join('text')
      .attr('transform',a=>`translate(${lab.centroid(a)})`).attr('text-anchor','middle').attr('dy','.35em')
      .attr('fill','#fff').attr('font-size',13).attr('font-weight',700).attr('stroke','#0006').attr('stroke-width',2.5).attr('paint-order','stroke')
      .style('pointer-events','none').text(a=>pct(a.data.v/total));
  }
  let h=`<tr><th>族群</th><th>人口</th><th>比例</th></tr>`;
  items.forEach(x=>h+=`<tr data-k="${x.k}"><td><span class="dot" style="background:${x.color}"></span>${x.name}</td><td>${fmt(x.v)}</td><td>${total>0?pct(x.v/total):'–'}</td></tr>`);
  h+=`<tr class="tot"><td>總計</td><td>${fmt(p.s)}</td><td></td></tr>`;
  const tb=d3.select('#tb').html(h);
  tb.selectAll('tr[data-k]').on('mouseenter',function(){hl(this.dataset.k)}).on('mouseleave',()=>hl(null));
  const note=document.getElementById('note');
  note.hidden=!(p.sum>p.s);
  if(p.sum>p.s)note.textContent=`註：四族群合計（${fmt(p.sum)}）大於資料中的總數（${fmt(p.s)}），比例以四族群合計為分母。`;
  document.getElementById('ov').hidden=false;
  document.getElementById('cx').focus();
}
function hl(k){
  d3.selectAll('#pie path').classed('hl',a=>k&&a.data.k===k);
  d3.selectAll('#tb tr[data-k]').classed('hl',function(){return k&&this.dataset.k===k});
}
function closeDlg(){document.getElementById('ov').hidden=true;if(selEl){selEl.classList.remove('sel');selEl=null}}
document.getElementById('cx').onclick=closeDlg;
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeDlg()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeDlg()});

addEventListener('resize',fit);
fit();paint();
</script>
</body>
</html>
